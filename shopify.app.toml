# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5a2865c40f0d0336af7e843686c54236"
name = "MetaVault"
application_url = "https://metavault-production.up.railway.app"
embedded = true

[build]
# Keep this false: `shopify app dev` would otherwise overwrite application_url
# above with an ephemeral tunnel URL and break the deployed app until the next
# `npm run deploy`.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Keeps the mirrored plan in ShopSettings in step with Shopify when a
  # subscription is cancelled, declined, or a trial lapses.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobject_definitions,read_metaobjects,write_metaobjects,read_products,write_products,read_customers,write_customers,read_orders,write_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://metavault-production.up.railway.app/auth/callback",
  "https://metavault-production.up.railway.app/auth/shopify/callback",
  "https://metavault-production.up.railway.app/api/auth/callback"
]
